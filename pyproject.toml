[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense"
version = "0.1.0"
description = "A Mathematical Engine for Sensor Calibration, PCA, and Drift Monitoring"
readme = "PROJECT_BRIEF.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "nbformat>=5.2.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
